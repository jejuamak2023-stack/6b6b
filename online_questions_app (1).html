<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Questions - Primary 6 Assessment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Cinzel', serif;
        }
        .castle-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }
    </style>
</head>
<body class="castle-bg min-h-screen text-slate-100 flex flex-col">

    <!-- App Container -->
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="module">
        const QUESTIONS = [
            // PART 1: Vocabulary Fill-in-the-Blanks (1-15)
            { id: 1, part: 1, type: 'vocab', answer: 'chop', text: "The charity chef needs to _____ the vegetables to make a large pot of soup for the flood victims.", explanation: "'Chop' means to cut food into pieces with a knife." },
            { id: 2, part: 1, type: 'vocab', answer: 'pour', text: "Please _____ the hot water carefully when making tea for the people staying in the typhoon shelter.", explanation: "'Pour' means to cause liquid to flow from a container." },
            { id: 3, part: 1, type: 'vocab', answer: 'beat', text: "The volunteers _____ the eggs to make hot breakfasts for the children affected by the tsunami.", explanation: "'Beat' means to mix ingredients vigorously." },
            { id: 4, part: 1, type: 'vocab', answer: 'sprinkle', text: "We will _____ some cheese on top of the pasta before delivering it to the earthquake survivors.", explanation: "'Sprinkle' means to scatter small drops or particles." },
            { id: 5, part: 1, type: 'vocab', answer: 'selfish', text: "Do not be _____ and keep all the emergency food to yourself during a storm.", explanation: "'Selfish' means lacking consideration for others." },
            { id: 6, part: 1, type: 'vocab', answer: 'fierce', text: "The _____ winds of the typhoon blew away the charity food tents outside the community hall.", explanation: "'Fierce' describes very strong, violent weather or nature." },
            { id: 7, part: 1, type: 'vocab', answer: 'fry', text: "You should _____ the chicken in oil until it is golden brown to serve at the charity dinner.", explanation: "'Fry' means to cook in hot fat or oil." },
            { id: 8, part: 1, type: 'vocab', answer: 'wise', text: "The rescue team leader is very _____ and always knows the safest routes to deliver food during a flood.", explanation: "'Wise' means having experience, knowledge, and good judgment." },
            { id: 9, part: 1, type: 'vocab', answer: 'lonely', text: "The child felt _____ after losing his home in the landslip, so the chefs sat with him and shared a warm meal.", explanation: "'Lonely' is sad because one has no friends or company." },
            { id: 10, part: 1, type: 'vocab', answer: 'stir', text: "Please _____ the soup slowly so it does not burn while we prepare to feed the storm victims.", explanation: "'Stir' means to move a spoon around in a circular motion." },
            { id: 11, part: 1, type: 'vocab', answer: 'bake', text: "The chef will _____ a large batch of fresh bread in the oven for the charity food drive.", explanation: "'Bake' means to cook food by dry heat in an oven." },
            { id: 12, part: 1, type: 'vocab', answer: 'boil', text: "We must _____ the tap water to make it safe to drink after the severe rain contaminated the supply.", explanation: "'Boil' means to heat liquid until it reaches bubbling vapor point." },
            { id: 13, part: 1, type: 'vocab', answer: 'cruel', text: "It is _____ to ignore the cries for help from the village trapped by the floodwaters.", explanation: "'Cruel' means willfully causing pain or suffering." },
            { id: 14, part: 1, type: 'vocab', answer: 'spread', text: "Make sure to _____ jam on the toast before handing it out at the thunderstorm shelter.", explanation: "'Spread' means to apply a soft substance over a surface." },
            { id: 15, part: 1, type: 'vocab', answer: 'curious', text: "The young boy was _____ and asked the chef many questions about how to cook for 100 people after the earthquake.", explanation: "'Curious' means eager to know or learn something." },

            // PART 2 & 3: Grammar Connectives (16-35)
            { id: 16, part: 2, type: 'grammar', answer: 'Although', text: "_____ the chef was very tired, he continued to cook for the flood victims.", explanation: "'Although' introduces a concession clause." },
            { id: 17, part: 2, type: 'grammar', answer: 'before', text: "We must pack the emergency food kits _____ the typhoon hits the city tonight.", explanation: "'Before' indicates prior time sequence." },
            { id: 18, part: 2, type: 'grammar', answer: 'so that', text: "We are raising funds for the charity _____ the victims can rebuild their homes after the severe earthquake.", explanation: "'So that' expresses purpose or goal." },
            { id: 19, part: 2, type: 'grammar', answer: 'After', text: "_____ the tsunami warning sounds, everyone must leave the kitchen and move to higher ground immediately.", explanation: "'After' indicates subsequent time sequence." },
            { id: 20, part: 2, type: 'grammar', answer: 'Although', text: "_____ the roads were blocked by the landslip, the rescue team managed to deliver the ingredients on foot.", explanation: "'Although' connects contrasting clauses." },
            { id: 21, part: 2, type: 'grammar', answer: 'Before', text: "_____ you chop the vegetables for the charity stew, wash them with clean water.", explanation: "'Before' indicates order of operations in food prep." },
            { id: 22, part: 2, type: 'grammar', answer: 'so that', text: "The super chef cooked extra large pots of rice _____ everyone in the flood shelter would have enough to eat.", explanation: "'So that' shows the intended result." },
            { id: 23, part: 2, type: 'grammar', answer: 'after', text: "The volunteers served hot meals _____ the firefighters rescued the trapped families from the landslip.", explanation: "'After' establishes chronological order of rescue then food." },
            { id: 24, part: 2, type: 'grammar', answer: 'Although', text: "_____ the severe rain ruined the crops, the local chefs created delicious meals with the remaining root vegetables.", explanation: "'Although' introduces an unexpected contrast." },
            { id: 25, part: 2, type: 'grammar', answer: 'before', text: "Please distribute the warm blankets to the victims _____ they eat their hot soup.", explanation: "'Before' specifies timing order." },
            { id: 26, part: 2, type: 'grammar', answer: 'so that', text: "The rescue team distributed flashlights to the villagers _____ they could see safely during the thunderstorm's power outage.", explanation: "'So that' explains the purpose of the flashlights." },
            { id: 27, part: 2, type: 'grammar', answer: 'After', text: "_____ the severe rain stopped, the charity workers started clearing the roads to deliver food.", explanation: "'After' indicates action following cessation of rain." },
            { id: 28, part: 2, type: 'grammar', answer: 'Although', text: "_____ we only had a few ingredients, the super chef made a wonderful pasta dish for everyone in the shelter.", explanation: "'Although' introduces a counter-expectation." },
            { id: 29, part: 2, type: 'grammar', answer: 'before', text: "The engineers must check the charity kitchen for damage _____ you allow the chefs to go back inside following the earthquake.", explanation: "'Before' ensures safety checks happen first." },
            { id: 30, part: 2, type: 'grammar', answer: 'but', text: "It was dangerous to go out during the thunderstorm, _____ the rescue workers went anyway to deliver the hot food.", explanation: "'But' coordinates contrasting clauses." },
            { id: 31, part: 2, type: 'grammar', answer: 'Before', text: "_____ you enter the flooded area to rescue people, make sure you put on a life jacket.", explanation: "'Before' indicates precautionary sequence." },
            { id: 32, part: 2, type: 'grammar', answer: 'Although', text: "_____ the volunteers have never cooked for 500 people before, they did a fantastic job at the charity drive.", explanation: "'Although' highlights impressive performance despite lack of experience." },
            { id: 33, part: 2, type: 'grammar', answer: 'before', text: "The chef will bake 50 loaves of bread _____ the storm arrives so people have safe food to eat.", explanation: "'Before' places baking ahead of storm impact." },
            { id: 34, part: 2, type: 'grammar', answer: 'but', text: "I enjoy cooking for my community, _____ I do not like cleaning the giant kitchen after a big charity event.", explanation: "'But' introduces a contrast in sentiment." },
            { id: 35, part: 2, type: 'grammar', answer: 'After', text: "_____ we set up the outdoor charity tents, it started to thunderstorm heavily, ruining the flour.", explanation: "'After' sets the timing sequence of setup followed by rain." },

            // PART 4: Error Correction (36-45)
            { id: 36, part: 3, type: 'error', answer: 'After you pour the mixture into the cake tin, you bake it in the oven for the charity bake sale.', text: "Correct: After pour the mixture into the cake tin, you bake it in the oven for the charity bake sale.", explanation: "Missing subject pronoun 'you' after 'After'." },
            { id: 37, part: 3, type: 'error', answer: 'Although the flood waters were rising, the rescue boat arrived in time to save the chefs.', text: "Correct: Although the flood waters were rising, but the rescue boat arrived in time to save the chefs.", explanation: "Do not use 'Although' and 'but' together in the same sentence." },
            { id: 38, part: 3, type: 'error', answer: 'Before you chop the meat for the charity stew, you must wash your hands with clean water.', text: "Correct: Before chop the meat for the charity stew, you must wash your hands with clean water.", explanation: "Missing subject pronoun 'you' after 'Before'." },
            { id: 39, part: 3, type: 'error', answer: 'Although the kitchen was destroyed by the earthquake, the brave chef still cooked a meal outdoors.', text: "Correct: Although the kitchen was destroyed by the earthquake, but the brave chef still cooked a meal outdoors.", explanation: "Do not use 'Although' and 'but' together." },
            { id: 40, part: 3, type: 'error', answer: 'After you spread the butter on the bread, you serve it to the families waiting in the thunderstorm shelter.', text: "Correct: After spread the butter on the bread, you serve it to the families waiting in the thunderstorm shelter.", explanation: "Missing subject pronoun 'you' after 'After'." },
            { id: 41, part: 3, type: 'error', answer: 'Although the charity event was held during a typhoon, many people still came to donate money.', text: "Correct: Although the charity event was held during a typhoon, but many people still came to donate money.", explanation: "Remove redundant 'but'." },
            { id: 42, part: 3, type: 'error', answer: 'Before you boil the water from the river, you should filter it to remove the dirt from the landslip.', text: "Correct: Before boil the water from the river, you should filter it to remove the dirt from the landslip.", explanation: "Missing subject pronoun 'you' after 'Before'." },
            { id: 43, part: 3, type: 'error', answer: 'Although the chef lacked ingredients after the storm, he managed to make a delicious and filling meal.', text: "Correct: Although the chef lacked ingredients after the storm, but he managed to make a delicious and filling meal.", explanation: "Remove redundant 'but'." },
            { id: 44, part: 3, type: 'error', answer: 'After you sprinkle the cheese on top, you put the dish into the oven to feed the tsunami survivors.', text: "Correct: After sprinkle the cheese on top, you put the dish into the oven to feed the tsunami survivors.", explanation: "Missing subject pronoun 'you' after 'After'." },
            { id: 45, part: 3, type: 'error', answer: 'Although the severe rain caused a lot of damage, the charity workers rebuilt the community kitchen quickly.', text: "Correct: Although the severe rain caused a lot of damage, but the charity workers rebuilt the community kitchen quickly.", explanation: "Remove redundant 'but'." }
        ];

        let currentStudentName = localStorage.getItem('p6_student_name') || '';
        let currentView = 'login'; // 'login', 'test', 'results', 'teacher_login', 'teacher_dash'
        let studentAnswers = {};
        let activeDocId = localStorage.getItem('p6_doc_id') || null;
        let studentResultsData = null;
        let teacherLoginError = '';

        function getLocalSubmissions() {
            try {
                const local = localStorage.getItem('p6_local_submissions');
                return local ? JSON.parse(local) : [];
            } catch (e) {
                return [];
            }
        }

        function saveLocalSubmission(sub) {
            try {
                let subs = getLocalSubmissions();
                const idx = subs.findIndex(s => s.id === sub.id);
                if (idx >= 0) {
                    subs[idx] = sub;
                } else {
                    subs.unshift(sub);
                }
                localStorage.setItem('p6_local_submissions', JSON.stringify(subs));
            } catch (e) {}
        }

        function renderPuckySVG(sizeClass = "w-32 h-32") {
            return `
                <svg viewBox="0 0 200 200" class="${sizeClass}" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(100, 100)">
                        <path d="M-40,-50 L0,-90 L40,-50 Z" fill="#FBBF24" />
                        <circle cx="0" cy="-90" r="10" fill="#FCD34D" />
                        <circle cx="0" cy="0" r="60" fill="#FFF4E6" />
                        <circle cx="-35" cy="15" r="12" fill="#FFA5B5" opacity="0.6" />
                        <circle cx="35" cy="15" r="12" fill="#FFA5B5" opacity="0.6" />
                        <circle cx="-20" cy="-5" r="6" fill="#1E3A8A" />
                        <circle cx="20" cy="-5" r="6" fill="#1E3A8A" />
                        <circle cx="-22" cy="-7" r="2" fill="#FFFFFF" />
                        <circle cx="18" cy="-7" r="2" fill="#FFFFFF" />
                        <path d="M-10,15 Q0,25 10,15" fill="none" stroke="#1E3A8A" strokeWidth="3" strokeLinecap="round" />
                    </g>
                </svg>
            `;
        }

        function normalize(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/[.,]/g, '').replace(/\s+/g, ' ').trim();
        }

        function checkAnswer(q, userAns) {
            return normalize(userAns) === normalize(q.answer);
        }

        function renderApp() {
            const root = document.getElementById('root');
            if (!root) return;

            // VIEW: LOGIN SCREEN
            if (currentView === 'login') {
                root.innerHTML = `
                    <div class="min-h-screen castle-bg flex flex-col items-center justify-center p-4 relative overflow-hidden">
                        <div class="absolute top-10 left-10 text-yellow-300 opacity-60 animate-bounce">✨</div>
                        <div class="absolute top-32 right-20 text-yellow-200 opacity-40">⭐</div>
                        
                        <div class="z-10 bg-[#FFF9E6] border-4 border-[#D4AF37] rounded-3xl shadow-[0_0_50px_rgba(212,175,55,0.4)] p-8 md:p-12 max-w-md w-full text-center relative mt-12">
                            <div class="absolute -top-24 left-1/2 -translate-x-1/2 drop-shadow-xl">
                                ${renderPuckySVG("w-40 h-40")}
                            </div>
                            
                            <h1 class="text-3xl md:text-4xl font-extrabold text-blue-900 mt-14 mb-2 font-serif">Online questions</h1>
                            <div class="w-32 h-1 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent mx-auto mb-8"></div>
                            
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold text-blue-900 mb-2 text-left">Full English Name *</label>
                                    <input 
                                        type="text" 
                                        id="studentNameInput"
                                        placeholder="e.g. Chan Tai Man" 
                                        value="${currentStudentName}"
                                        class="w-full px-5 py-4 rounded-2xl border-2 border-[#D4AF37] bg-white text-blue-900 font-bold text-lg focus:outline-none focus:ring-4 focus:ring-yellow-200 text-center placeholder-slate-400 shadow-inner"
                                    />
                                </div>
                                
                                <button 
                                    id="startTestBtn"
                                    class="w-full bg-gradient-to-r from-blue-700 to-blue-900 hover:from-blue-800 hover:to-blue-950 text-yellow-300 font-bold py-4 px-6 rounded-2xl text-xl border-2 border-yellow-500/50 shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"
                                >
                                    <span>Start Assessment</span> <i data-lucide="sparkles" class="w-5 h-5"></i>
                                </button>
                            </div>

                            <div class="mt-8 pt-6 border-t border-[#D4AF37]/30">
                                <button 
                                    id="gotoTeacherLogin"
                                    class="text-sm font-bold text-blue-900/60 hover:text-blue-900 flex items-center justify-center gap-2 w-full transition-colors"
                                >
                                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Teacher Dashboard Access
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('startTestBtn').onclick = () => {
                    const nameVal = document.getElementById('studentNameInput').value.trim();
                    if (!nameVal) {
                        alert('Please enter your full English name before starting.');
                        return;
                    }
                    currentStudentName = nameVal;
                    localStorage.setItem('p6_student_name', currentStudentName);

                    activeDocId = 'sub_' + Date.now() + '_' + Math.random().toString(36).substring(2,7);
                    localStorage.setItem('p6_doc_id', activeDocId);
                    
                    const newSub = {
                        id: activeDocId,
                        studentName: currentStudentName,
                        status: 'In Progress',
                        startTime: new Date().toISOString(),
                        totalScore: 0,
                        answers: {}
                    };
                    saveLocalSubmission(newSub);

                    currentView = 'test';
                    renderApp();
                };

                document.getElementById('gotoTeacherLogin').onclick = () => {
                    currentView = 'teacher_login';
                    renderApp();
                };

            } else if (currentView === 'teacher_login') {
                root.innerHTML = `
                    <div class="min-h-screen castle-bg flex items-center justify-center p-4">
                        <div class="bg-[#FFF9E6] border-4 border-[#D4AF37] rounded-3xl p-8 max-w-md w-full text-center relative shadow-2xl">
                            <h2 class="text-2xl font-bold text-blue-900 font-serif mb-2">Teacher Gateway</h2>
                            <p class="text-slate-600 text-sm mb-6">Restricted access for authorised teacher account.</p>
                            
                            ${teacherLoginError ? `<div class="mb-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm font-bold">${teacherLoginError}</div>` : ''}

                            <div class="space-y-4 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-blue-900 uppercase mb-1">Teacher Email</label>
                                    <input type="email" id="tEmail" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-slate-800 font-semibold focus:outline-none focus:border-yellow-500" placeholder="jeju.amak.2023@gmail.com" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-blue-900 uppercase mb-1">Password</label>
                                    <input type="password" id="tPass" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-slate-800 font-semibold focus:outline-none focus:border-yellow-500" placeholder="••••••••" />
                                </div>
                                <button id="tLoginBtn" class="w-full bg-blue-900 hover:bg-blue-950 text-yellow-300 font-bold py-3.5 rounded-xl text-lg shadow-md transition-all">
                                    Access Teacher Portal
                                </button>
                            </div>

                            <button id="backToLogin" class="mt-6 text-sm font-bold text-slate-500 hover:text-slate-800">
                                &larr; Back to Student Login
                            </button>
                        </div>
                    </div>
                `;

                document.getElementById('tLoginBtn').onclick = () => {
                    const email = document.getElementById('tEmail').value.trim();
                    if (email !== 'jeju.amak.2023@gmail.com') {
                        teacherLoginError = 'Access Denied: Only jeju.amak.2023@gmail.com is authorized.';
                        renderApp();
                        return;
                    }
                    teacherLoginError = '';
                    currentView = 'teacher_dash';
                    renderApp();
                };

                document.getElementById('backToLogin').onclick = () => {
                    currentView = 'login';
                    teacherLoginError = '';
                    renderApp();
                };

            } else if (currentView === 'test') {
                root.innerHTML = `
                    <div class="min-h-screen castle-bg py-8 px-4 sm:px-6 lg:px-8">
                        <div class="max-w-4xl mx-auto">
                            
                            <div class="bg-[#FFF9E6] border-b-4 border-[#D4AF37] p-6 rounded-t-3xl flex justify-between items-center shadow-xl text-blue-900">
                                <div class="flex items-center gap-4">
                                    ${renderPuckySVG("w-14 h-14")}
                                    <div>
                                        <h2 class="text-2xl font-bold font-serif">Online Questions</h2>
                                        <p class="text-sm font-semibold text-yellow-800">Student: ${currentStudentName}</p>
                                    </div>
                                </div>
                                <div class="text-right hidden sm:block">
                                    <span class="text-xs uppercase tracking-wider font-bold text-slate-500 block">Total Questions</span>
                                    <span class="text-2xl font-black text-blue-900">45 items</span>
                                </div>
                            </div>

                            <div class="bg-white/10 backdrop-blur-md p-6 md:p-10 rounded-b-3xl border border-yellow-500/30 shadow-2xl space-y-10">
                                
                                <section class="bg-white p-6 md:p-8 rounded-3xl border-2 border-[#D4AF37] text-slate-800 shadow-xl relative">
                                    <div class="absolute -top-5 -left-5 bg-gradient-to-br from-yellow-300 to-yellow-500 w-12 h-12 rounded-full flex items-center justify-center text-blue-900 font-black text-xl shadow-lg border-2 border-white">1</div>
                                    <h3 class="text-2xl font-bold text-blue-900 mb-1 font-serif">Part 1: Vocabulary Fill-in-the-Blanks (1–15)</h3>
                                    <p class="text-slate-500 mb-6 text-sm">Word Bank: bake, beat, boil, chop, fry, mix, pour, spread, sprinkle, stir, cruel, curious, fierce, lonely, selfish, wise.</p>

                                    <div class="space-y-6">
                                        ${QUESTIONS.filter(q => q.part === 1).map((q, idx) => `
                                            <div class="flex gap-4 items-start bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                                <span class="font-bold text-yellow-600 mt-1">${idx + 1}.</span>
                                                <div class="flex-1 text-base md:text-lg font-medium leading-relaxed text-slate-800">
                                                    ${q.text.replace('_____', `<input type="text" data-qid="${q.id}" class="q-input inline-block w-36 border-b-4 border-blue-300 mx-2 px-2 py-0.5 text-center text-blue-900 bg-white rounded font-bold focus:outline-none focus:border-yellow-500" value="${studentAnswers[q.id] || ''}" />`)}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>

                                <section class="bg-white p-6 md:p-8 rounded-3xl border-2 border-[#D4AF37] text-slate-800 shadow-xl relative">
                                    <div class="absolute -top-5 -left-5 bg-gradient-to-br from-yellow-300 to-yellow-500 w-12 h-12 rounded-full flex items-center justify-center text-blue-900 font-black text-xl shadow-lg border-2 border-white">2</div>
                                    <h3 class="text-2xl font-bold text-blue-900 mb-1 font-serif">Part 2 & 3: Grammar Connectives (16–35)</h3>
                                    <p class="text-slate-500 mb-6 text-sm">Fill in the blanks with: before, after, Although, but, so that.</p>

                                    <div class="space-y-6">
                                        ${QUESTIONS.filter(q => q.part === 2).map((q, idx) => `
                                            <div class="flex gap-4 items-start bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                                <span class="font-bold text-yellow-600 mt-1">${idx + 16}.</span>
                                                <div class="flex-1 text-base md:text-lg font-medium leading-relaxed text-slate-800">
                                                    ${q.text.replace('_____', `<input type="text" data-qid="${q.id}" class="q-input inline-block w-32 border-b-4 border-blue-300 mx-2 px-2 py-0.5 text-center text-blue-900 bg-white rounded font-bold focus:outline-none focus:border-yellow-500" value="${studentAnswers[q.id] || ''}" />`)}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>

                                <section class="bg-white p-6 md:p-8 rounded-3xl border-2 border-[#D4AF37] text-slate-800 shadow-xl relative">
                                    <div class="absolute -top-5 -left-5 bg-gradient-to-br from-yellow-300 to-yellow-500 w-12 h-12 rounded-full flex items-center justify-center text-blue-900 font-black text-xl shadow-lg border-2 border-white">3</div>
                                    <h3 class="text-2xl font-bold text-blue-900 mb-1 font-serif">Part 4: Error Correction (36–45)</h3>
                                    <p class="text-slate-500 mb-6 text-sm">Rewrite the full sentence correctly, fixing subject pronoun placement and redundant conjunctions.</p>

                                    <div class="space-y-6">
                                        ${QUESTIONS.filter(q => q.part === 3).map((q, idx) => `
                                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                                <span class="font-bold text-yellow-600 inline-block mb-2">${idx + 36}.</span>
                                                <p class="text-base text-blue-900 font-semibold mb-3 bg-blue-50 p-3 rounded-xl border border-blue-100">${q.text}</p>
                                                <textarea data-qid="${q.id}" rows="2" class="q-input w-full rounded-xl border-2 border-slate-300 p-3 text-slate-900 font-medium focus:outline-none focus:border-yellow-500 shadow-inner" placeholder="Type your corrected sentence here...">${studentAnswers[q.id] || ''}</textarea>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>

                                <div class="text-center pt-4">
                                    <button id="submitTestBtn" class="bg-gradient-to-r from-yellow-400 to-yellow-600 hover:from-yellow-500 hover:to-yellow-700 text-blue-950 font-black py-5 px-16 rounded-full text-2xl shadow-[0_0_30px_rgba(250,204,21,0.5)] transform hover:-translate-y-1 transition-all border-4 border-[#FFF9E6]">
                                        Submit Assessment
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>
                `;

                document.querySelectorAll('.q-input').forEach(input => {
                    const handleInputEvent = (e) => {
                        const qid = e.target.getAttribute('data-qid');
                        studentAnswers[qid] = e.target.value;
                    };
                    input.addEventListener('input', handleInputEvent);
                    input.addEventListener('change', handleInputEvent);
                });

                const submitBtn = document.getElementById('submitTestBtn');
                if (submitBtn) {
                    submitBtn.onclick = () => {
                        document.querySelectorAll('.q-input').forEach(input => {
                            const qid = input.getAttribute('data-qid');
                            if (qid) {
                                studentAnswers[qid] = input.value;
                            }
                        });

                        let score = 0;
                        QUESTIONS.forEach(q => {
                            if (checkAnswer(q, studentAnswers[q.id])) {
                                score++;
                            }
                        });

                        studentResultsData = { score, total: QUESTIONS.length, answers: {...studentAnswers} };

                        if (activeDocId) {
                            const updatedSub = {
                                id: activeDocId,
                                studentName: currentStudentName,
                                status: 'Submitted',
                                totalScore: score,
                                answers: studentAnswers,
                                endTime: new Date().toISOString()
                            };
                            saveLocalSubmission(updatedSub);
                        }

                        currentView = 'results';
                        renderApp();
                        window.scrollTo(0, 0);
                    };
                }

            } else if (currentView === 'results') {
                const res = studentResultsData || { score: 0, total: 45, answers: {} };

                root.innerHTML = `
                    <div class="min-h-screen castle-bg py-8 px-4 sm:px-6 lg:px-8">
                        <div class="max-w-4xl mx-auto">
                            
                            <div class="bg-[#FFF9E6] border-4 border-[#D4AF37] p-8 md:p-10 rounded-3xl text-center shadow-2xl mb-10 relative overflow-hidden text-blue-900">
                                ${renderPuckySVG("w-24 h-24 mx-auto mb-4")}
                                <h2 class="text-3xl font-extrabold font-serif mb-2">Assessment Completed!</h2>
                                <p class="text-lg text-blue-800 mb-6 font-semibold">Fantastic effort, ${currentStudentName}!</p>
                                
                                <div class="inline-block bg-white px-8 py-4 rounded-2xl border-2 border-yellow-400 shadow-inner">
                                    <span class="text-xs uppercase font-bold text-slate-400 block mb-1">Your Final Score</span>
                                    <span class="text-5xl font-black text-blue-900">${res.score} <span class="text-2xl text-slate-400">/ ${res.total}</span></span>
                                </div>
                            </div>

                            <div class="space-y-6">
                                ${QUESTIONS.map((q, idx) => {
                                    const userAns = res.answers[q.id] || '';
                                    const isCorrect = checkAnswer(q, userAns);
                                    return `
                                        <div class="bg-white p-6 rounded-3xl border-4 ${isCorrect ? 'border-green-400 shadow-[0_5px_15px_rgba(74,222,128,0.2)]' : 'border-red-300 shadow-[0_5px_15px_rgba(248,113,113,0.2)]'} text-slate-800">
                                            <div class="flex items-center gap-3 mb-3">
                                                <span class="font-bold text-lg text-slate-500">Q${idx + 1}.</span>
                                                <span class="px-3 py-1 rounded-full text-xs font-black uppercase ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                                    ${isCorrect ? '✓ Correct' : '✕ Incorrect'}
                                                </span>
                                            </div>

                                            <p class="text-base md:text-lg font-medium text-slate-900 mb-4">${q.text}</p>

                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 text-sm">
                                                <div class="p-4 rounded-2xl border-2 ${isCorrect ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'}">
                                                    <span class="block font-bold text-xs uppercase text-slate-500 mb-1">Your Answer:</span>
                                                    <span class="font-bold text-base">${userAns || '(No Answer)'}</span>
                                                </div>
                                                ${!isCorrect ? `
                                                    <div class="p-4 rounded-2xl bg-blue-50 border-2 border-blue-200 text-blue-900">
                                                        <span class="block font-bold text-xs uppercase text-slate-500 mb-1">Correct Answer:</span>
                                                        <span class="font-bold text-base">${q.answer}</span>
                                                    </div>
                                                ` : ''}
                                            </div>

                                            <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 text-sm">
                                                <span class="font-bold block mb-1">💡 Teacher Explanation:</span>
                                                ${q.explanation}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="mt-10 text-center">
                                <button id="returnHomeBtn" class="bg-blue-900 hover:bg-blue-950 text-yellow-300 font-bold py-4 px-10 rounded-2xl text-lg shadow-xl">
                                    Return to Title Screen
                                </button>
                            </div>

                        </div>
                    </div>
                `;

                document.getElementById('returnHomeBtn').onclick = () => {
                    currentView = 'login';
                    currentStudentName = '';
                    studentAnswers = {};
                    activeDocId = null;
                    localStorage.removeItem('p6_student_name');
                    localStorage.removeItem('p6_doc_id');
                    renderApp();
                };

            } else if (currentView === 'teacher_dash') {
                const allSubs = getLocalSubmissions();

                root.innerHTML = `
                    <div class="min-h-screen bg-slate-100 text-slate-800 p-4 md:p-8">
                        <div class="max-w-7xl mx-auto">
                            
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                                <div class="flex items-center gap-4">
                                    <div class="bg-blue-900 p-4 rounded-2xl text-yellow-400">
                                        <i data-lucide="layout-dashboard" class="w-8 h-8"></i>
                                    </div>
                                    <div>
                                        <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900 font-serif">Teacher Portal Dashboard</h1>
                                        <p class="text-slate-500 font-medium">Class Submissions Monitor (Local Storage Version)</p>
                                    </div>
                                </div>
                                <button id="teacherLogout" class="flex items-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-3 rounded-xl font-bold transition-colors">
                                    <i data-lucide="log-out" class="w-5 h-5"></i> Log Out
                                </button>
                            </div>

                            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-blue-50/50">
                                    <h3 class="font-bold text-blue-900 text-lg">Student Submissions (${allSubs.length})</h3>
                                    <span class="text-xs uppercase font-bold text-slate-500 bg-white px-3 py-1 rounded-full border">Active</span>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase font-bold">
                                                <th class="p-4">Student Name</th>
                                                <th class="p-4">Status</th>
                                                <th class="p-4 text-center">Score</th>
                                                <th class="p-4 text-center">Timestamp</th>
                                                <th class="p-4 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100 text-sm font-medium">
                                            ${allSubs.length === 0 ? `
                                                <tr>
                                                    <td colspan="5" class="p-12 text-center text-slate-400 font-medium">
                                                        No student submissions recorded yet on this device.
                                                    </td>
                                                </tr>
                                            ` : allSubs.map(s => `
                                                <tr class="hover:bg-slate-50 transition-colors">
                                                    <td class="p-4 font-bold text-slate-900 text-base">${s.studentName}</td>
                                                    <td class="p-4">
                                                        <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase ${s.status === 'Submitted' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                                                            ${s.status}
                                                        </span>
                                                    </td>
                                                    <td class="p-4 text-center font-black text-blue-900 text-base">
                                                        ${s.status === 'Submitted' ? `${s.totalScore} / 45` : '-'}
                                                    </td>
                                                    <td class="p-4 text-center text-slate-500">
                                                        ${s.startTime ? new Date(s.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '-'}
                                                    </td>
                                                    <td class="p-4 text-center">
                                                        ${s.status === 'Submitted' ? `
                                                            <button onclick="window.viewStudentReport('${s.id}')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-4 py-1.5 rounded-xl font-bold text-xs transition-colors">
                                                                Review Report
                                                            </button>
                                                        ` : '<span class="text-slate-400 text-xs">In Progress</span>'}
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                document.getElementById('teacherLogout').onclick = () => {
                    currentView = 'login';
                    renderApp();
                };
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        window.viewStudentReport = function(docId) {
            const allSubs = getLocalSubmissions();
            const student = allSubs.find(s => s.id === docId);
            if (!student) return;

            let reportHtml = `
                <div id="reportModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 text-slate-800 max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div class="flex justify-between items-center mb-6 border-b pb-4">
                            <div>
                                <h3 class="text-2xl font-bold text-blue-900 font-serif">${student.studentName}'s Report</h3>
                                <p class="text-sm text-slate-500">Score: <strong class="text-blue-900 text-lg">${student.totalScore} / 45</strong></p>
                            </div>
                            <button onclick="document.getElementById('reportModal').remove()" class="bg-slate-100 hover:bg-slate-200 p-2 rounded-full font-bold">✕</button>
                        </div>
                        <div class="space-y-4">
                            ${QUESTIONS.map((q, idx) => {
                                const ans = student.answers ? student.answers[q.id] || '' : '';
                                const correct = checkAnswer(q, ans);
                                return `
                                    <div class="p-4 rounded-2xl border ${correct ? 'bg-green-50/50 border-green-200' : 'bg-red-50/50 border-red-200'}">
                                        <div class="flex justify-between items-start mb-1">
                                            <span class="font-bold text-xs text-slate-500 uppercase">Q${idx + 1} (${q.type})</span>
                                            <span class="text-xs font-bold px-2 py-0.5 rounded ${correct ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">${correct ? 'Correct' : 'Incorrect'}</span>
                                        </div>
                                        <p class="text-sm font-semibold text-slate-900 mb-2">${q.text}</p>
                                        <div class="text-xs space-y-1">
                                            <p><strong class="text-slate-600">Student Answer:</strong> <span class="${correct ? 'text-green-700 font-bold' : 'text-red-600 font-bold'}">${ans || '(Blank)'}</span></p>
                                            ${!correct ? `<p><strong class="text-slate-600">Correct Answer:</strong> <span class="text-blue-700 font-bold">${q.answer}</span></p>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', reportHtml);
        };

        // Start the application
        renderApp();
    </script>
</body>
</html>
